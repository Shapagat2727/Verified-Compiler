name: Idris CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Idris 2
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libgmp-dev chezscheme
        git clone https://github.com/idris-lang/Idris2.git
        cd Idris2
        make bootstrap SCHEME=chezscheme
        sudo make install
        sudo cp ./bootstrap-build/bin/idris2 /usr/local/bin/
        sudo cp ./bootstrap-build/bin/idris2_app /usr/local/bin/
        which idris2
        idris2 --version
    